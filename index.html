<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>低空智联网技术专业 - 招生咨询</title>
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
 .chat-container { width: 100%; max-width: 400px; height: 80vh; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; }
 .chat-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
 .chat-header h1 { font-size: 18px; margin-bottom: 5px; }
 .chat-header p { font-size: 12px; opacity: 0.9; }
 .chat-messages { flex: 1; overflow-y: auto; padding: 20px; background: #f5f5f5; }
 .message { margin-bottom: 15px; display: flex; }
 .message.bot { justify-content: flex-start; }
 .message.user { justify-content: flex-end; }
 .message-content { max-width: 70%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
 .message.bot .message-content { background: white; color: #333; border-bottom-left-radius: 4px; }
 .message.user .message-content { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-bottom-right-radius: 4px; }
 .chat-input { padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; }
 .chat-input input { flex: 1; padding: 12px 16px; border: 2px solid #eee; border-radius: 25px; outline: none; font-size: 14px; }
 .chat-input input:focus { border-color: #667eea; }
 .chat-input button { padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: bold; }
 .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
 </style>
</head>
<body>
 <div class="chat-container">
 <div class="chat-header">
 <h1>🛩️ 低空智联网技术专业</h1>
 <p>昆明航空职业学院 · 招生咨询助手</p>
 </div>
 <div class="chat-messages" id="messages">
 <div class="message bot">
 <div class="message-content">你好！欢迎咨询低空智联网技术专业，我是招生助手。有什么想了解的吗？</div>
 </div>
 </div>
 <div class="chat-input">
 <input type="text" id="userInput" placeholder="输入你的问题..." onkeypress="if(event.key==='Enter')sendMessage()">
 <button onclick="sendMessage()" id="sendBtn">发送</button>
 </div>
 </div>

 <script>
 function sendMessage() {
 const input = document.getElementById('userInput');
 const btn = document.getElementById('sendBtn');
 const text = input.value.trim();
 if (!text) return;

 input.value = '';
 btn.disabled = true;

 const messages = document.getElementById('messages');
 
 // 添加用户消息
 const userDiv = document.createElement('div');
 userDiv.className = 'message user';
 userDiv.innerHTML = '<div class="message-content">' + text + '</div>';
 messages.appendChild(userDiv);

 // 添加加载提示
 const loadingDiv = document.createElement('div');
 loadingDiv.className = 'message bot';
 loadingDiv.innerHTML = '<div class="message-content">正在思考...</div>';
 messages.appendChild(loadingDiv);
 messages.scrollTop = messages.scrollHeight;

 // 调用后端 API
 fetch('https://1437681420-ivq4knj6m7.ap-guangzhou.tencentscf.com/chat', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ message: text })
 })
 .then(res => res.json())
 .then(data => {
 loadingDiv.remove();
 const botDiv = document.createElement('div');
 botDiv.className = 'message bot';
 botDiv.innerHTML = '<div class="message-content">' + (data.reply || '抱歉，我暂时无法回答。') + '</div>';
 messages.appendChild(botDiv);
 messages.scrollTop = messages.scrollHeight;
 })
 .catch(err => {
 loadingDiv.remove();
 const errDiv = document.createElement('div');
 errDiv.className = 'message bot';
 errDiv.innerHTML = '<div class="message-content">网络错误，请稍后再试。</div>';
 messages.appendChild(errDiv);
 })
 .finally(() => {
 btn.disabled = false;
 });
 }
 </script>
</body>
</html>
